# 자동 검사 (docs/testing.md): PR을 올리거나 main에 병합하면 lint, 타입 검사, 단위 시험, 빌드를 돌립니다.
# 비밀 값은 쓰지 않습니다. 빌드에 필요한 두 값은 브라우저에도 보이는 공개 값입니다 (wrangler.jsonc와 같음).
name: 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위 시험
        run: npm test
      - name: 빌드
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://gxcnjcqfykcpbtikhixs.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rmealKeNWymyCvfvxdDRXA_lyJJ8X_c
